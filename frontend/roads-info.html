<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Информация по дорогам</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- ШАПКА САЙТА -->
    <header id="header">
        <div class="header-container">
            <div class="logo">
                <span>🌲 Лесные дороги</span>
            </div>

            <nav class="main-nav">
                <a href="/">Главная</a>
                <a href="/roads-info.html" class="active">Информация по дорогам</a>
                <a href="#" id="auth-link" class="auth-link">Войти</a>
            </nav>

            <div class="search-container">
                <input type="text" id="search-input" placeholder="Поиск дороги...">
                <button id="search-btn">🔍</button>
            </div>

            <button class="mobile-menu-toggle" aria-label="Меню">☰</button>
        </div>
    </header>

    <!-- ОСНОВНАЯ ОБЛАСТЬ -->
    <main id="roads-info-main">
        <div class="container">
            <h1>Информация по дорогам</h1>

            <div class="table-toolbar">
                <div class="toolbar-left">
                    <span id="user-status">Гость (только просмотр)</span>
                </div>
                <div class="toolbar-right">
                    <button id="add-row-btn" class="btn-success hidden">➕ Добавить запись</button>
                    <button id="refresh-btn" class="btn-secondary">🔄 Обновить</button>
                </div>
            </div>

            <div class="table-container">
                <table id="roads-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Район</th>
                            <th>Автодорога</th>
                            <th>Условия проезда</th>
                            <th>Обновил</th>
                            <th>Дата обновления</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <tr>
                            <td colspan="7" class="loading-text">Загрузка данных...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- МОДАЛЬНОЕ ОКНО ДЛЯ ДОБАВЛЕНИЯ/РЕДАКТИРОВАНИЯ -->
    <div id="edit-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="edit-modal-title">Добавить запись</h2>
                <button class="modal-close" id="edit-modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="edit-form">
                    <input type="hidden" id="edit-id">
                    <div class="form-group">
                        <label for="edit-district">Район</label>
                        <input type="text" id="edit-district" required>
                    </div>
                    <div class="form-group">
                        <label for="edit-road">Автодорога</label>
                        <input type="text" id="edit-road" required>
                    </div>
                    <div class="form-group">
                        <label for="edit-conditions">Условия проезда</label>
                        <textarea id="edit-conditions" rows="4" required></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn-secondary" id="edit-cancel">Отмена</button>
                        <button type="submit" class="btn-primary" id="edit-save">Сохранить</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
